<style>
/* Journal — design tokens and components.
   Every rule the whole site shares lives here, in one part, because the engine
   inlines each template into its own response: a rule written inside
   single.html would simply not exist on the front page. */
:root{
  --bg:oklch(99.2% 0.003 90);
  --surface:oklch(100% 0 0);
  --surface-2:oklch(97.5% 0.004 265);
  --text:oklch(21% 0.012 265);
  --muted:oklch(52% 0.014 265);
  --faint:oklch(66% 0.012 265);
  --border:oklch(91% 0.006 265);
  --accent:oklch(52% 0.19 268);
  --accent-soft:oklch(95.5% 0.03 268);
  --shadow:0 1px 2px oklch(21% 0.012 265 / 0.06), 0 10px 30px oklch(21% 0.012 265 / 0.05);
  --font-ui:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,"Noto Sans",sans-serif;
  --font-serif:ui-serif,Georgia,Cambria,"Times New Roman","Noto Serif",serif;
  --font-mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --radius:14px;
  /* The shell is deliberately narrow. A blog is read, not scanned: a measure
     that spans a desktop viewport forces the eye back across 130 characters a
     line, and no amount of whitespace fixes that. */
  --wrap:48rem;
  --measure:42rem;
}
[data-theme="dark"]{
  --bg:oklch(17% 0.012 265);
  --surface:oklch(21% 0.014 265);
  --surface-2:oklch(24% 0.014 265);
  --text:oklch(94% 0.006 265);
  --muted:oklch(70% 0.012 265);
  --faint:oklch(57% 0.012 265);
  --border:oklch(29% 0.014 265);
  --accent:oklch(76% 0.14 268);
  --accent-soft:oklch(28% 0.05 268);
  --shadow:0 1px 2px oklch(0% 0 0 / 0.3), 0 10px 30px oklch(0% 0 0 / 0.25);
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:var(--font-ui);
  font-size:16px;
  line-height:1.6;
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
  /* A column, so the footer sits at the bottom of short pages (404, an empty
     archive) instead of floating in the middle of the viewport. `dvh` after
     `vh` because mobile browsers shrink `vh` under a visible URL bar. */
  min-height:100vh;
  min-height:100dvh;
  display:flex;
  flex-direction:column;
}
main{flex:1 0 auto}
img,svg,video{max-width:100%;height:auto;display:block}
a{color:inherit;text-decoration:none}
a:hover{color:var(--accent)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:4px}

.wrap{max-width:var(--wrap);margin-inline:auto;padding-inline:1.25rem}
.skip{position:absolute;left:-9999px}
.skip:focus{left:1rem;top:1rem;z-index:50;background:var(--surface);padding:.6rem 1rem;border-radius:8px;border:1px solid var(--border)}

/* ---- header ---- */
.site-header{
  position:sticky;top:0;z-index:20;
  background:color-mix(in oklab,var(--bg) 82%,transparent);
  backdrop-filter:saturate(1.6) blur(12px);
  border-bottom:1px solid var(--border);
}
.site-header .wrap{display:flex;align-items:center;gap:1.5rem;min-height:4.25rem}
.brand{font-weight:650;letter-spacing:-0.02em;font-size:1.075rem;white-space:nowrap}
.brand-dot{color:var(--accent)}
.site-nav{display:flex;gap:1.35rem;margin-left:auto;align-items:center;flex-wrap:wrap}
.site-nav a{font-size:.9rem;color:var(--muted);letter-spacing:.01em}
.site-nav a:hover{color:var(--text)}
.lang-nav{display:flex;gap:.15rem}
.lang-nav a{font-size:.8rem;font-variant-caps:all-small-caps;padding:.2rem .45rem;border-bottom:2px solid transparent}
.lang-nav a.on{color:var(--text);border-color:var(--accent)}
.theme-toggle{
  display:inline-flex;align-items:center;justify-content:center;
  width:2.25rem;height:2.25rem;border-radius:999px;
  border:1px solid var(--border);background:var(--surface);
  cursor:pointer;color:var(--muted);flex:none;
}
.theme-toggle:hover{color:var(--text);border-color:var(--faint)}
.theme-toggle svg{width:1.05rem;height:1.05rem}
.theme-toggle .i-moon{display:none}
[data-theme="dark"] .theme-toggle .i-sun{display:none}
[data-theme="dark"] .theme-toggle .i-moon{display:block}

/* ---- hero ---- */
.hero{padding:4.5rem 0 2.75rem;border-bottom:1px solid var(--border)}
.hero h1{
  margin:0;
  font-size:clamp(2.15rem,6vw,3.5rem);
  line-height:1.08;
  letter-spacing:-0.035em;
  font-weight:700;
  max-width:22ch;
}
.hero p{margin:1.1rem 0 0;color:var(--muted);font-size:1.1rem;max-width:52ch;line-height:1.65}

/* ---- section headings ---- */
.section-head{
  display:flex;align-items:baseline;justify-content:space-between;gap:1rem;
  margin:3rem 0 1.25rem;
}
.section-head h2{margin:0;font-size:.8rem;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);font-weight:600}

/* ---- post list ---- */
.post-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.post-item{border-top:1px solid var(--border)}
.post-item:first-child{border-top:0}
.post-link{display:block;padding:1.6rem 0;transition:transform .18s ease}
.post-link:hover{transform:translateX(3px)}
.post-date{font-size:.78rem;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);font-variant-numeric:tabular-nums}
.post-title{margin:.45rem 0 0;font-size:1.5rem;line-height:1.28;letter-spacing:-0.022em;font-weight:650;color:var(--text)}
.post-link:hover .post-title{color:var(--accent)}
.post-excerpt{margin:.5rem 0 0;color:var(--muted);font-size:1rem;line-height:1.62;max-width:60ch}
.post-more{margin-top:.7rem;font-size:.86rem;color:var(--accent);font-weight:550}

/* ---- single / page ---- */
.article{padding:3.5rem 0 1rem}
.article-head{max-width:var(--measure);margin-inline:auto}
.article h1{
  margin:0;
  font-size:clamp(1.95rem,5vw,2.9rem);
  line-height:1.14;
  letter-spacing:-0.03em;
  font-weight:700;
}
.article-meta{display:flex;flex-wrap:wrap;align-items:center;gap:.5rem;margin-top:1rem;color:var(--faint);font-size:.85rem}
.article-meta .dot{opacity:.5}
.lede{margin:1.1rem 0 0;font-size:1.15rem;line-height:1.6;color:var(--muted);font-family:var(--font-serif)}

/* ---- prose (rendered block HTML) ---- */
.prose{max-width:var(--measure);margin:2.5rem auto 0;font-family:var(--font-serif);font-size:1.115rem;line-height:1.78;color:var(--text)}
.prose > *:first-child{margin-top:0}
.prose p{margin:0 0 1.35em}
.prose h2{margin:2.4em 0 .7em;font-family:var(--font-ui);font-size:1.45rem;line-height:1.28;letter-spacing:-0.02em;font-weight:650}
.prose h3{margin:2em 0 .6em;font-family:var(--font-ui);font-size:1.18rem;letter-spacing:-0.015em;font-weight:650}
.prose ul,.prose ol{margin:0 0 1.35em;padding-left:1.35em}
.prose li{margin:.4em 0}
.prose li::marker{color:var(--faint)}
.prose blockquote{
  margin:1.9em 0;padding:.2em 0 .2em 1.35em;
  border-left:3px solid var(--accent);
  color:var(--muted);font-style:italic;
}
.prose blockquote p:last-child{margin-bottom:0}
.prose hr{margin:2.6em 0;border:0;border-top:1px solid var(--border)}
.prose a{color:var(--accent);text-decoration:underline;text-underline-offset:.18em;text-decoration-thickness:1px}
.prose code{font-family:var(--font-mono);font-size:.86em;background:var(--surface-2);padding:.14em .38em;border-radius:5px;border:1px solid var(--border)}
.prose pre{
  margin:0 0 1.5em;padding:1.1rem 1.2rem;overflow-x:auto;
  background:var(--surface-2);border:1px solid var(--border);border-radius:10px;
  font-family:var(--font-mono);font-size:.86rem;line-height:1.62;
}
.prose pre code{background:none;border:0;padding:0;font-size:1em}
.prose img,.prose figure{margin:1.9em 0;border-radius:10px}
.prose .gallery{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:.6rem;margin:1.9em 0}
.prose .gallery img{margin:0;border-radius:8px}
.prose .wp-button{display:inline-block;background:var(--accent);color:var(--surface);padding:.6rem 1.1rem;border-radius:999px;font-family:var(--font-ui);font-size:.9rem;font-weight:550;text-decoration:none}
.prose .wp-columns{display:grid;grid-template-columns:1fr 1fr;gap:1.4rem;margin:1.9em 0}

/* ---- back link ---- */
.back{margin:3rem auto 0;max-width:var(--measure);font-size:.9rem}
.back a{color:var(--muted)}
.back a:hover{color:var(--accent)}

/* ---- empty / 404 ---- */
.empty{margin:3rem 0;padding:3rem 1.5rem;text-align:center;color:var(--muted);border:1px dashed var(--border);border-radius:var(--radius);background:var(--surface)}
.notfound{padding:5rem 0;text-align:center}
.notfound .code{font-size:4rem;font-weight:700;letter-spacing:-0.04em;color:var(--faint);line-height:1}
.notfound h1{margin:.5rem 0 0;font-size:1.6rem;letter-spacing:-0.02em}
.notfound p{margin:.75rem 0 0;color:var(--muted)}

/* ---- footer ---- */
.site-footer{margin-top:5rem;border-top:1px solid var(--border);padding:2.5rem 0 3rem;color:var(--faint);font-size:.875rem}
.site-footer .wrap{display:flex;flex-wrap:wrap;gap:.75rem 2rem;align-items:baseline;justify-content:space-between}
.site-footer a{color:var(--muted)}
.site-footer .meta{font-variant-numeric:tabular-nums}

@media (max-width:640px){
  .hero{padding:3rem 0 2rem}
  .hero p{font-size:1rem}
  .site-header .wrap{min-height:3.6rem;gap:.75rem}
  .site-nav{gap:1rem}
  .post-title{font-size:1.28rem}
  .article{padding:2.5rem 0 1rem}
  .prose{font-size:1.06rem}
  .prose .wp-columns{grid-template-columns:1fr}
  .site-footer .wrap{flex-direction:column;gap:.4rem}
}
@media (prefers-reduced-motion:reduce){
  *{transition:none!important;scroll-behavior:auto!important}
  .post-link:hover{transform:none}
}
</style>
