<!doctype html><html lang="{{site.locale}}"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{{page.title}} | {{site.title}}</title><meta name="description" content="{{page.description}}"><style>body{font-family:system-ui;max-width:980px;margin:auto;padding:24px}nav{display:flex;gap:16px;margin:20px 0}img{max-width:100%}</style></head><body><header><strong>{{site.title}}</strong><nav>{{menu.primary}}</nav></header><main><h1>{{page.title}}</h1>{{#if posts}}<ul class="posts">{{#each posts as post}}<li><h2><a href="{{post.url}}">{{post.title}}</a></h2>{{#if post.excerpt}}<p>{{post.excerpt}}</p>{{/if}}</li>{{/each}}</ul>{{else}}<p>Nothing published yet.</p>{{/if}}</main><footer>{{site.title}}</footer></body></html>
