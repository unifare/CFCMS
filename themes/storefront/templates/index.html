<!doctype html>
<html lang="{{locale}}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>{{page.title}} — {{site.title}}</title>
</head>
<body>
  <header><a href="/{{locale}}">{{site.title}}</a></header>
  <main>
    <h1>{{page.title}}</h1>
    {{#if site.description}}<p>{{site.description}}</p>{{/if}}
    {{#each posts as p}}
      <article>
        <h3><a href="{{p.url}}">{{p.title}}</a></h3>
        {{#if p.excerpt}}<p>{{p.excerpt}}</p>{{/if}}
      </article>
    {{/each}}
  </main>
</body>
</html>
