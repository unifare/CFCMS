<!doctype html>
<html lang="{{locale}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{page.document_title}}</title>
{{#if page.description}}<meta name="description" content="{{page.description}}">{{/if}}
<style>
  :root{
    --ink:#15130f; --muted:#6f695e; --line:#e6e1d6; --bg:#fbfaf7;
    --card:#ffffff; --accent:#1f6f4a; --accent-ink:#ffffff; --price:#8a3b12;
    --radius:10px;
  }
  @media (prefers-color-scheme:dark){
    :root{--ink:#efece4;--muted:#9d968a;--line:#302c25;--bg:#141310;--card:#1b1a16;
          --accent:#5fbf90;--accent-ink:#0d1a13;--price:#e0a06a}
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
       font:16px/1.6 system-ui,-apple-system,"Segoe UI",sans-serif}
  .wrap{max-width:60rem;margin:0 auto;padding:0 1.25rem}
  a{color:inherit}

  header.site{border-bottom:1px solid var(--line);background:var(--card)}
  header.site .wrap{display:flex;align-items:baseline;gap:1.5rem;
                    padding-block:1rem;flex-wrap:wrap}
  .brand{font-weight:700;letter-spacing:-.02em;text-decoration:none}
  nav.primary{display:flex;gap:1.1rem;font-size:.94rem;margin-inline-start:auto}
  nav.primary a{color:var(--muted);text-decoration:none}
  nav.primary a:hover{color:var(--accent)}

  main{padding-block:2.5rem 4rem}

  h1{font-size:clamp(1.6rem,3.6vw,2.2rem);line-height:1.2;margin:0 0 .5rem;letter-spacing:-.02em}
  h2{font-size:1.15rem;margin:0 0 .3rem}
  .lede{color:var(--muted);font-size:1.05rem;margin:0 0 2rem;max-width:46ch}
  .eyebrow{text-transform:uppercase;letter-spacing:.12em;font-size:.72rem;
           color:var(--muted);margin:0 0 .5rem;font-weight:600}

  .grid{list-style:none;margin:0;padding:0;display:grid;gap:1.25rem;
        grid-template-columns:repeat(auto-fill,minmax(15rem,1fr))}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
        padding:1.25rem;display:flex;flex-direction:column;gap:.4rem;min-height:8rem}
  .card h2{margin:0}
  .card h2 a{text-decoration:none}
  .card h2 a:hover{text-decoration:underline;text-underline-offset:3px}
  .card p{margin:0;color:var(--muted);font-size:.93rem}
  .card .row{margin-top:auto;display:flex;align-items:baseline;gap:.75rem;
             padding-top:.75rem;border-top:1px solid var(--line)}
  .price{font-weight:700;color:var(--price);font-variant-numeric:tabular-nums}
  .stock{font-size:.82rem;color:var(--muted)}

  .detail{display:grid;gap:2rem;grid-template-columns:1fr}
  @media (min-width:46rem){.detail{grid-template-columns:1.6fr 1fr}}
  .buy{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
       padding:1.5rem;height:fit-content;position:sticky;top:1.5rem}
  .buy .price{font-size:1.7rem;display:block;margin-bottom:.75rem}
  .cta{display:inline-block;background:var(--accent);color:var(--accent-ink);
       border:0;border-radius:8px;padding:.7rem 1.2rem;font:inherit;font-weight:600;
       cursor:pointer;text-decoration:none}
  .cta:hover{filter:brightness(1.08)}
  .meta-list{list-style:none;margin:1rem 0 0;padding:0;font-size:.9rem;color:var(--muted)}
  .meta-list li{display:flex;justify-content:space-between;gap:1rem;
                padding:.4rem 0;border-top:1px solid var(--line)}
  .crumbs{font-size:.85rem;color:var(--muted);margin:0 0 1.25rem}
  .crumbs a{text-decoration:none}
  .crumbs a:hover{text-decoration:underline}

  article.post :is(h2,h3){margin-top:2rem}
  article.post img{max-width:100%;height:auto}
  .empty{color:var(--muted);font-style:italic}

  footer.site{border-top:1px solid var(--line);color:var(--muted);font-size:.87rem}
  footer.site .wrap{padding-block:1.5rem;display:flex;gap:1rem;flex-wrap:wrap;
                    justify-content:space-between}
</style>
</head>
<body>
{{@include "parts/header"}}
<main class="wrap">
{{@section "content"}}
</main>
{{@include "parts/footer"}}
</body>
</html>
