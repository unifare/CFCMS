{{@extends "parts/layout"}}
{{@section "content"}}

<article class="page">
  <header class="page-head wrap-narrow">
    <nav class="crumbs" aria-label="Breadcrumb">
      <a href="/{{locale}}">Home</a>
      <span class="faint" aria-hidden="true">/</span>
      <span class="muted">Page</span>
    </nav>
    <h1 class="page-title">{{page.title}}</h1>
    {{#if page.description}}<p class="page-standfirst">{{page.description}}</p>{{/if}}
  </header>

  <div class="wrap-narrow">
    <div class="prose">
      {{#if post.html}}{{{post.html}}}{{else}}<p class="muted">This page has no content yet.</p>{{/if}}
    </div>
  </div>
</article>

<style>
.page{padding-bottom:4rem}
.page-head{padding:clamp(2.5rem,6vw,4rem) clamp(1.1rem,4vw,2rem) 1.75rem;
  text-align:center;border-bottom:1px solid var(--line-soft);
  margin-bottom:2.5rem}
.page-title{margin:0 0 .7rem}
.page-standfirst{color:var(--text-soft);font-size:1.1rem;
  max-width:44ch;margin:0 auto}
.prose{min-width:0}
.prose>*{max-width:var(--measure)}
.prose h2{margin-top:2.2em}
.prose h2::before{content:"";display:block;width:2rem;height:3px;
  background:var(--accent);border-radius:2px;margin-bottom:.75rem}
.prose h3{margin-top:1.8em}
.prose figure img{border-radius:var(--radius-lg);box-shadow:var(--shadow-md)}
.prose .wp-columns{display:grid;grid-template-columns:1fr 1fr;gap:1.5rem;max-width:100%}
.prose .gallery{display:grid;grid-template-columns:1fr 1fr;gap:.75rem;max-width:100%}
.prose .wp-button{display:inline-block;background:var(--accent);
  color:var(--accent-ink);font-family:var(--font-sans);font-size:.9rem;
  font-weight:600;padding:.6rem 1.2rem;border-radius:var(--radius);
  text-decoration:none}
@media (max-width:640px){.prose .wp-columns,.prose .gallery{grid-template-columns:1fr}}
</style>

{{/section}}
