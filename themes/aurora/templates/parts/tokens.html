{{
!  Aurora — design tokens + base layer.
!  Split into its own partial so every page shares one source of truth and the
!  browser caches it once. Inlined via @include (the engine has no asset
!  pipeline), so keep it lean.
}}
<style>
/* ---------------------------------------------------------------- tokens --
 * Warm paper light mode / deep ink dark mode. Colours are authored in oklch
 * for perceptually even steps; every value here is mirrored in the .dark
 * block below so the two themes stay in lockstep.
 */
:root{
  --bg:oklch(0.9911 0.0043 91.4);
  --bg-sunk:oklch(0.9723 0.0061 91.4);
  --surface:oklch(1 0 0);
  --text:oklch(0.2185 0.0126 264.1);
  --text-soft:oklch(0.4437 0.0173 264.4);
  --text-faint:oklch(0.6050 0.0146 264.5);
  --line:oklch(0.9189 0.0059 264.5);
  --line-soft:oklch(0.9528 0.0039 264.5);
  --accent:oklch(0.5535 0.1743 27.7);
  --accent-hover:oklch(0.4998 0.1651 27.9);
  --accent-soft:oklch(0.9604 0.0198 27.6);
  --accent-ink:oklch(0.9911 0.0043 91.4);
  --gold:oklch(0.8058 0.1301 79.9);
  --teal:oklch(0.6205 0.0875 191.7);
  --radius:0.5rem;
  --radius-lg:0.875rem;
  --shadow-sm:0 1px 2px oklch(0.2185 0.0126 264.1 / .06);
  --shadow-md:0 4px 16px -4px oklch(0.2185 0.0126 264.1 / .10),0 2px 6px -2px oklch(0.2185 0.0126 264.1 / .06);
  --shadow-lg:0 18px 48px -12px oklch(0.2185 0.0126 264.1 / .18),0 6px 18px -8px oklch(0.2185 0.0126 264.1 / .10);
  --measure:68ch;
  --wide:72rem;
  --font-body:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,"Songti SC","Noto Serif CJK SC",serif;
  --font-sans:ui-sans-serif,-apple-system,"Segoe UI",Roboto,"Helvetica Neue","PingFang SC","Microsoft YaHei",sans-serif;
  --font-mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
}
.dark{
  --bg:oklch(0.1808 0.0122 264.4);
  --bg-sunk:oklch(0.1614 0.0116 264.4);
  --surface:oklch(0.2140 0.0131 264.4);
  --text:oklch(0.9384 0.0059 264.5);
  --text-soft:oklch(0.7468 0.0122 264.5);
  --text-faint:oklch(0.5769 0.0139 264.5);
  --line:oklch(0.2957 0.0136 264.4);
  --line-soft:oklch(0.2530 0.0131 264.4);
  --accent:oklch(0.7043 0.1592 24.4);
  --accent-hover:oklch(0.7606 0.1462 25.2);
  --accent-soft:oklch(0.2670 0.0521 26.6);
  --accent-ink:oklch(0.1808 0.0122 264.4);
  --gold:oklch(0.8284 0.1188 82.4);
  --teal:oklch(0.7257 0.0852 190.5);
  --shadow-sm:0 1px 2px oklch(0 0 0 / .3);
  --shadow-md:0 4px 16px -4px oklch(0 0 0 / .45),0 2px 6px -2px oklch(0 0 0 / .3);
  --shadow-lg:0 18px 48px -12px oklch(0 0 0 / .6),0 6px 18px -8px oklch(0 0 0 / .4);
}

/* ----------------------------------------------------------------- reset -- */
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth;scroll-padding-top:5.5rem}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
body{
  margin:0;background:var(--bg);color:var(--text);
  font-family:var(--font-body);font-size:clamp(1rem,0.96rem + 0.2vw,1.125rem);
  line-height:1.75;font-kerning:normal;
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
  transition:background-color .25s ease,color .25s ease;
}
img{max-width:100%;height:auto;display:block}
a{color:var(--accent);text-decoration:none;text-underline-offset:.22em;
  text-decoration-thickness:max(1px,.0625em)}
a:hover{text-decoration:underline}
h1,h2,h3,h4,h5,h6{
  font-family:var(--font-sans);color:var(--text);
  line-height:1.2;letter-spacing:-.021em;
  margin:0 0 .5em;font-weight:600;text-wrap:balance;
}
h1{font-size:clamp(2rem,1.5rem + 2.4vw,3.25rem);letter-spacing:-.032em}
h2{font-size:clamp(1.5rem,1.25rem + 1.1vw,2rem)}
h3{font-size:clamp(1.2rem,1.1rem + 0.5vw,1.4rem)}
p{margin:0 0 1.25em;text-wrap:pretty}
ul,ol{padding-left:1.4em}
hr{border:0;border-top:1px solid var(--line);margin:3rem 0}
code{font-family:var(--font-mono);font-size:.875em;
  background:var(--bg-sunk);border:1px solid var(--line-soft);
  padding:.12em .38em;border-radius:.3em}
pre{font-family:var(--font-mono);font-size:.85em;line-height:1.6;
  background:var(--bg-sunk);border:1px solid var(--line);
  border-radius:var(--radius);padding:1.1rem 1.25rem;overflow-x:auto;
  margin:0 0 1.5rem}
pre code{background:none;border:0;padding:0;font-size:1em}
blockquote{margin:1.75rem 0;padding:.25rem 0 .25rem 1.4rem;
  border-left:3px solid var(--accent);color:var(--text-soft);font-style:italic}
blockquote p:last-child{margin-bottom:0}
table{width:100%;border-collapse:collapse;font-family:var(--font-sans);
  font-size:.9rem;margin:0 0 1.5rem}
th,td{text-align:left;padding:.6rem .75rem;border-bottom:1px solid var(--line)}
th{font-weight:600;color:var(--text-soft);font-size:.78rem;
  text-transform:uppercase;letter-spacing:.06em}
::selection{background:var(--accent);color:var(--accent-ink)}

/* ------------------------------------------------------------ primitives -- */
.wrap{max-width:var(--wide);margin:0 auto;padding:0 clamp(1.1rem,4vw,2rem)}
.wrap-narrow{max-width:calc(var(--measure) + 8rem);margin:0 auto;
  padding:0 clamp(1.1rem,4vw,2rem)}
.skip{position:absolute;left:-9999px;top:0;z-index:100;
  background:var(--accent);color:var(--accent-ink);
  padding:.75rem 1.25rem;border-radius:0 0 var(--radius) 0;font-family:var(--font-sans)}
.skip:focus{left:0}
.eyebrow{font-family:var(--font-sans);font-size:.72rem;font-weight:600;
  letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
.muted{color:var(--text-soft)}
.faint{color:var(--text-faint)}
.rule{height:1px;background:var(--line);border:0;margin:0}

/* ---------------------------------------------------------------- header -- */
.masthead{position:sticky;top:0;z-index:50;
  background:color-mix(in oklab,var(--bg) 88%,transparent);
  -webkit-backdrop-filter:saturate(180%) blur(14px);
  backdrop-filter:saturate(180%) blur(14px);
  border-bottom:1px solid var(--line-soft)}
.masthead-in{display:flex;align-items:center;gap:1.5rem;
  height:4.25rem;justify-content:space-between}
.brand{display:flex;align-items:center;gap:.7rem;
  font-family:var(--font-sans);font-weight:700;color:var(--text);
  font-size:1.06rem;letter-spacing:-.03em;text-decoration:none}
.brand:hover{text-decoration:none;opacity:.85}
.brand-mark{width:1.9rem;height:1.9rem;flex:0 0 auto;border-radius:.5rem;
  background:linear-gradient(140deg,var(--accent),var(--gold));
  display:grid;place-items:center;color:var(--accent-ink);
  box-shadow:var(--shadow-sm)}
.brand-mark svg{width:1.15rem;height:1.15rem}
.mainnav{display:flex;align-items:center;gap:.35rem;
  font-family:var(--font-sans);font-size:.9rem}
.mainnav a{color:var(--text-soft);padding:.4rem .7rem;border-radius:.4rem;
  font-weight:500;text-decoration:none;transition:background-color .15s,color .15s}
.mainnav a:hover{color:var(--text);background:var(--bg-sunk);text-decoration:none}
.masthead-tools{display:flex;align-items:center;gap:.5rem}
.theme-btn{width:2.25rem;height:2.25rem;display:grid;place-items:center;
  border:1px solid var(--line);background:var(--surface);color:var(--text-soft);
  border-radius:.5rem;cursor:pointer;padding:0;transition:color .15s,border-color .15s}
.theme-btn:hover{color:var(--text);border-color:var(--text-faint)}
.theme-btn svg{width:1.05rem;height:1.05rem}
.nav-toggle{display:none;width:2.25rem;height:2.25rem;place-items:center;
  border:1px solid var(--line);background:var(--surface);color:var(--text-soft);
  border-radius:.5rem;cursor:pointer;padding:0}
.nav-toggle svg{width:1.1rem;height:1.1rem}
@media (max-width:800px){
  .mainnav{display:none}
  .mainnav.open{display:flex;position:absolute;left:0;right:0;top:4.25rem;
    flex-direction:column;align-items:stretch;gap:0;
    background:var(--surface);border-bottom:1px solid var(--line);
    padding:.5rem;box-shadow:var(--shadow-md)}
  .mainnav.open a{padding:.7rem .9rem}
  .nav-toggle{display:grid}
}

/* ----------------------------------------------------------------- cards -- */
.card{background:var(--surface);border:1px solid var(--line);
  border-radius:var(--radius-lg);box-shadow:var(--shadow-sm);
  overflow:hidden;transition:box-shadow .2s ease,transform .2s ease,border-color .2s}
.card:hover{box-shadow:var(--shadow-md);border-color:var(--text-faint)}
.card-pad{padding:1.5rem 1.6rem}

/* Post summary card. Lives here rather than in one page so every template that
 * renders a card — home, archive, related-articles — gets identical sizing.
 * The arrow needs an explicit box or the SVG expands to fill its container. */
.post-card-link{display:flex;flex-direction:column;height:100%;
  padding:1.5rem 1.6rem;text-decoration:none;color:inherit;min-height:13rem}
.post-card-link:hover{text-decoration:none}
.post-card-top{margin-bottom:.9rem}
.post-card-title{margin:0 0 .55rem;font-size:1.16rem;line-height:1.3;
  transition:color .15s}
.post-card-link:hover .post-card-title{color:var(--accent)}
.post-card-excerpt{color:var(--text-soft);font-size:.94rem;margin:0 0 1.25rem;flex:1}
.post-card-foot{display:flex;align-items:center;justify-content:space-between;
  margin-top:auto;font-family:var(--font-sans);font-size:.78rem;
  font-weight:600;color:var(--accent)}
.post-card-foot .arrow{width:1rem;height:1rem;flex:0 0 auto;transition:transform .2s}
.post-card-link:hover .arrow{transform:translateX(3px)}

/* Section heading with a trailing rule — used by every listing surface. */
.grid-head{display:flex;align-items:center;gap:1.25rem;margin:0 0 1.75rem}
.grid-head h2{margin:0;font-size:1.15rem;letter-spacing:-.01em}
.grid-head .rule{flex:1;height:1px;background:var(--line)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(17rem,1fr));
  gap:1.4rem;padding-bottom:1rem}

/* ------------------------------------------------------------------ tags -- */
.tag{display:inline-flex;align-items:center;gap:.3rem;
  font-family:var(--font-sans);font-size:.68rem;font-weight:600;
  letter-spacing:.07em;text-transform:uppercase;
  color:var(--accent);background:var(--accent-soft);
  padding:.28rem .55rem;border-radius:.35rem;
  border:1px solid color-mix(in oklab,var(--accent) 22%,transparent)}
.tag-plain{color:var(--text-soft);background:var(--bg-sunk);
  border-color:var(--line)}

/* ------------------------------------------------------------------ note -- */
.note{display:inline-flex;align-items:center;gap:.45rem;font-family:var(--font-sans);
  font-size:.75rem;color:var(--text-faint)}
.dot{width:3px;height:3px;border-radius:50%;background:currentColor;flex:0 0 auto}

/* ---------------------------------------------------------------- footer -- */
.foot{border-top:1px solid var(--line);margin-top:5rem;
  background:var(--bg-sunk);position:relative}
.foot::before{content:"";position:absolute;inset:0 0 auto;height:1px;
  background:linear-gradient(90deg,transparent,var(--accent),var(--gold),transparent);
  opacity:.4}
.foot-in{display:grid;grid-template-columns:1.6fr 1fr 1fr;gap:2.5rem;
  padding:3.25rem 0 2rem}
@media (max-width:720px){.foot-in{grid-template-columns:1fr;gap:1.75rem;
  padding:2.25rem 0 1.5rem}}
.foot h4{font-family:var(--font-sans);font-size:.72rem;font-weight:700;
  letter-spacing:.13em;text-transform:uppercase;color:var(--text-faint);
  margin:0 0 .9rem}
.foot-links{display:flex;flex-direction:column;gap:.5rem;
  font-family:var(--font-sans);font-size:.88rem}
.foot-links a{color:var(--text-soft);text-decoration:none}
.foot-links a:hover{color:var(--accent)}
.foot-base{border-top:1px solid var(--line);padding:1.25rem 0;
  display:flex;justify-content:space-between;align-items:center;
  gap:1rem;flex-wrap:wrap;font-family:var(--font-sans);
  font-size:.78rem;color:var(--text-faint)}

/* ------------------------------------------------------------- utilities -- */
.stack-lg>*+*{margin-top:1.5rem}
.sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;
  overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.print-only{display:none}
@media print{
  .masthead,.foot,.toc,.share,.themed{display:none!important}
  body{background:#fff;color:#000;font-size:11pt}
  a{color:#000;text-decoration:none}
  a[href^="http"]::after{content:" (" attr(href) ")";font-size:9pt;color:#555}
}
</style>
