<!doctype html>
<html lang="{{locale}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{#if page.document_title}}{{page.document_title}}{{else}}{{page.title}}{{#if site.title}} | {{site.title}}{{/if}}{{/if}}</title>
{{#if page.description}}<meta name="description" content="{{page.description}}">{{/if}}
<meta name="robots" content="{{#if site.robots}}{{site.robots}}{{else}}index,follow{{/if}}">
<meta name="generator" content="CFPress / {{theme.title}} {{theme.version}}">
<meta property="og:type" content="website">
<meta property="og:title" content="{{page.title}}">
{{#if page.description}}<meta property="og:description" content="{{page.description}}">{{/if}}
<meta property="og:site_name" content="{{site.title}}">
<meta name="twitter:card" content="summary_large_image">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">

<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%23c0392b'/><circle cx='16' cy='16' r='6' fill='none' stroke='%23fff' stroke-width='2.5'/></svg>">

<script>
/* Pre-paint theme bootstrap. Must stay in <head> and must not await anything:
 * it runs before the first frame so a dark-mode reader never sees a flash of
 * the light palette. Any failure falls through to the light default. */
(function(){try{
  var s=localStorage.getItem('aurora.theme');
  var d=s==='dark'||(!s&&window.matchMedia('(prefers-color-scheme: dark)').matches);
  if(d){document.documentElement.classList.add('dark');}
  document.documentElement.style.colorScheme=d?'dark':'light';
}catch(e){}})();
</script>

{{@include "parts/tokens"}}
</head>
<body>
{{@include "parts/header"}}
<main id="content">
{{@section "content"}}
</main>
{{@include "parts/footer"}}
</body>
</html>
