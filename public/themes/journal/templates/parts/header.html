<header class="site-header">
  <div class="wrap">
    <a class="brand" href="/{{locale}}">{{site.title}}<span class="brand-dot">.</span></a>
    <nav class="site-nav">
      {{#if menu.primary_html}}{{{menu.primary_html}}}{{/if}}
      {{! Language switcher — one entry per enabled site locale; the platform
          omits it entirely on a monolingual site. }}
      {{#if lang_nav}}<nav class="lang-nav" aria-label="Language">{{#each lang_nav as l}}<a href="{{l.url}}"{{#if l.current}} class="on" aria-current="true"{{/if}}>{{l.code}}</a>{{/each}}</nav>{{/if}}
      <button class="theme-toggle" type="button"
        aria-label="{{#if (contains(locale, "zh"))}}切换明暗主题{{else}}Toggle light and dark theme{{/if}}"
        title="{{#if (contains(locale, "zh"))}}切换明暗主题{{else}}Toggle light and dark theme{{/if}}">
        <svg class="i-sun" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path></svg>
        <svg class="i-moon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"></path></svg>
      </button>
    </nav>
  </div>
</header>
